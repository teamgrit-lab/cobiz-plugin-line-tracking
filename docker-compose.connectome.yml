# Opt in: docker compose -f docker-compose.yml -f docker-compose.connectome.yml
# up -d --build connectome-planner actual-activate
services:
  connectome-planner:
    cpu_shares: ${CONNECTOME_CPU_SHARES:-1024}
    build:
      context: .
      dockerfile: Dockerfile.connectome
      args:
        CONNECTOME_BASE_IMAGE: ${SWIN_L_DEBUG_IMAGE:-cobiz-plugin-line-tracking-swin-l-debug}
    image: cobiz-plugin-line-tracking-connectome
    network_mode: host
    runtime: nvidia
    volumes:
      - ${CONNECTOME_MODEL_DIR:-./models}:/models:ro
    environment:
      CONNECTOME_BUNDLE: ${CONNECTOME_BUNDLE:-/models/flyvis_encoder.pt}
      CONNECTOME_BUNDLE_SHA256: ${CONNECTOME_BUNDLE_SHA256:?set verified pretrained bundle SHA-256}
      CONNECTOME_DEVICE: ${CONNECTOME_DEVICE:-cuda}
      CONNECTOME_CUDA_GRAPH: ${CONNECTOME_CUDA_GRAPH:-false}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "/opt/connectome-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 3
    restart: unless-stopped
  actual-activate:
    depends_on:
      connectome-planner:
        condition: service_healthy
    environment:
      LINE_TRACKING_PATH_PLANNER: connectome
      LINE_TRACKING_CONNECTOME_URL: http://127.0.0.1:8091/v1/plan
      LINE_TRACKING_CONNECTOME_TIMEOUT_SEC: ${LINE_TRACKING_CONNECTOME_TIMEOUT_SEC:-0.8}
      LINE_TRACKING_CONNECTOME_MAX_AGE_SEC: ${LINE_TRACKING_CONNECTOME_MAX_AGE_SEC:-1.0}
  debugging-swin-l:
    environment:
      LINE_TRACKING_PATH_PLANNER: connectome
      LINE_TRACKING_CONNECTOME_URL: http://127.0.0.1:8091/v1/plan
