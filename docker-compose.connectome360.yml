# Select this override alone for Road=360 Flyvis pair, Sidewalk=legacy model.
services:
  connectome360:
    build:
      context: .
      dockerfile: Dockerfile.connectome
      args:
        CONNECTOME_BASE_IMAGE: ${LINE_TRACKING_IMAGE_NAME:-cobiz-plugin-line-tracking-runtime}
    image: cobiz-plugin-line-tracking-connectome360
    entrypoint: ["/opt/connectome-venv/bin/python", "/workspace/tools/connectome360_service.py"]
    command: ["--model", "/360-model", "--device", "cuda", "--port", "8093", "--direct-camera"]
    network_mode: host
    runtime: nvidia
    devices:
      - ${CONNECTUM_360_VIDEO_DEVICE:-/dev/video91}:/dev/video91
    volumes:
      - ${CONNECTUM_360_MODEL_DIR:-./models/connectome360-both-20261103-135251-10mps}:/360-model:ro
    environment:
      CONNECTUM_360_MODEL_SHA256: ${CONNECTUM_360_MODEL_SHA256:-1dd52c0e04834aaaf21f863201b1208ecb3725eb7ea49b84d1b7ee27f5d2b4e0}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "/opt/connectome-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  actual-activate:
    depends_on:
      connectome360:
        condition: service_started
    environment:
      LINE_TRACKING_MODE: task-drive
      LINE_TRACKING_PATH_MASK_CLASS: "1"
      LINE_TRACKING_INFERENCE_PROCESS: "false"
      LINE_TRACKING_PATH_PLANNER: local
      LINE_TRACKING_ROAD_DIRECT_INPUT: "true"
      # Explicitly clear mutually exclusive Road backends from older setups.
      LINE_TRACKING_FRONT_CONNECTOME_URL: ""
      LINE_TRACKING_FCN_SHA256: ""
      LINE_TRACKING_CONNECTOME360_URL: http://127.0.0.1:8093/v1/direct-road
      LINE_TRACKING_CONNECTOME360_SHA256: ${CONNECTUM_360_MODEL_SHA256:-1dd52c0e04834aaaf21f863201b1208ecb3725eb7ea49b84d1b7ee27f5d2b4e0}
      LINE_TRACKING_CONNECTOME360_TIMEOUT_SEC: ${LINE_TRACKING_CONNECTOME360_TIMEOUT_SEC:-2.0}
      LINE_TRACKING_CONNECTOME_MAX_AGE_SEC: ${LINE_TRACKING_CONNECTOME_MAX_AGE_SEC:-1.5}
