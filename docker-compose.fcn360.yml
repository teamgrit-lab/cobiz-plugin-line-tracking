# Road (1) selects FCN masks from the Insta camera; Sidewalk (2) keeps its configured pipeline.
x-fcn-identity: &fcn-identity
  LINE_TRACKING_FCN_SHA256: ${FCN360_MODEL_SHA256:-77197ab82305f61eb7e83d4bff7f2dfad0122a618ea9332b4c80236862733e7f}
  LINE_TRACKING_FCN_INPUT_WIDTH: ${FCN360_INPUT_WIDTH:-1024}

services:
  fcn360-road:
    image: ${SWIN_L_DEBUG_IMAGE:-cobiz-plugin-line-tracking-swin-l-debug}
    pull_policy: never
    network_mode: host
    ipc: host
    runtime: nvidia
    command: ["--direct-camera", "--port", "8094"]
    devices:
      - ${FCN360_VIDEO_DEVICE:-/dev/video91}:/dev/video91
    volumes:
      - ${FCN360_MODEL_DIR:-./models/fcn1024-road-20261103}:/fcn-model:ro
      - fcn360-engines:/fcn-engine-cache
    environment:
      <<: *fcn-identity
      SWIN_L_MODE: fcn360-detector
      ROS_DISTRO: ${ROS_DISTRO:-humble}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 3
    restart: unless-stopped
  actual-activate:
    depends_on:
      fcn360-road:
        condition: service_started
    environment:
      <<: *fcn-identity
      SWIN_L_MODE: task-drive
      SWIN_L_PATH_MASK_CLASS: "1"
      SWIN_L_INFERENCE_PROCESS: "false"
      LINE_TRACKING_PATH_PLANNER: local
      LINE_TRACKING_ROAD_DIRECT_INPUT: "true"
      LINE_TRACKING_FCN_URL: http://127.0.0.1:8094/v1/direct-road
      LINE_TRACKING_FCN_TIMEOUT_SEC: ${LINE_TRACKING_FCN_TIMEOUT_SEC:-2.0}
      LINE_TRACKING_FCN_HEIGHT_M: ${FCN360_HEIGHT_M:-1.6}
      LINE_TRACKING_FCN_MAX_AGE_SEC: ${FCN360_MAX_AGE_SEC:-1.0}

volumes:
  fcn360-engines:
