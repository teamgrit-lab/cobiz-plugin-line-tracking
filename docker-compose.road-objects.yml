# Apply after the base compose (and front-connectome overlay when used).
# The classifier file is prepared locally, then mounted with the existing /models volume.
services:
  actual-activate:
    environment:
      LINE_TRACKING_AVOIDANCE_ENABLED: "true"
      LINE_TRACKING_ROAD_OBJECTS_ENABLED: "true"
      LINE_TRACKING_ROAD_OBJECT_WEIGHTS: /models/road-objects-mobilenet-fpn.pth
      LINE_TRACKING_ROAD_OBJECT_SHA256: 907ea3f91ff92242bc1baea8049276a3e76bca48ce7560bd268cc029f37977b5
      LINE_TRACKING_ROAD_OBJECT_MIN_LATERAL_MPS: ${LINE_TRACKING_ROAD_OBJECT_MIN_LATERAL_MPS:-0.3}
      LINE_TRACKING_ROAD_OBJECT_MAX_LATERAL_MPS: ${LINE_TRACKING_ROAD_OBJECT_MAX_LATERAL_MPS:-0.8}
      LINE_TRACKING_ROAD_OBJECT_MIN_SCORE: ${LINE_TRACKING_ROAD_OBJECT_MIN_SCORE:-0.55}
      LINE_TRACKING_ROAD_OBJECT_MAX_RANGE_M: ${LINE_TRACKING_ROAD_OBJECT_MAX_RANGE_M:-6.0}
      LINE_TRACKING_ROAD_OBJECT_MAX_AGE_SEC: ${LINE_TRACKING_ROAD_OBJECT_MAX_AGE_SEC:-0.8}
      LINE_TRACKING_ROAD_OBJECT_MAX_SYNC_SEC: ${LINE_TRACKING_ROAD_OBJECT_MAX_SYNC_SEC:-0.25}
      # At 0.8 m/s the complete swept body needs a wider observed grid.
      LIDAR_OBSTACLE_HORIZONTAL_RANGE_M: "6.0"
      LIDAR_OBSTACLE_FOV_DEG: "360.0"
      LIDAR_OBSTACLE_HALF_WIDTH_M: "4.0"
      LIDAR_OBSTACLE_REAR_M: "3.0"
