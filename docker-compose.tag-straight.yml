# Optional sidewalk tag-to-tag segments. Append to the existing Compose files.
# The worker opens this camera only for a granted standalone task with both IDs.
services:
  actual-activate:
    devices:
      - ${TAG_ROUTE_VIDEO_DEVICE:-/dev/video91}:/dev/video91
    environment:
      LINE_TRACKING_TAG_ROUTE_ENABLED: "true"
      LINE_TRACKING_TAG_ROUTE_DEVICE: /dev/video91
      LINE_TRACKING_TAG_ROUTE_STATE_TOPIC: ${LINE_TRACKING_TAG_ROUTE_STATE_TOPIC:-/lf/sportmodestate}
      LINE_TRACKING_TAG_ROUTE_FRONT_CENTER_X: ${LINE_TRACKING_TAG_ROUTE_FRONT_CENTER_X:-720}
      LINE_TRACKING_TAG_ROUTE_CAMERA_X_M: ${LINE_TRACKING_TAG_ROUTE_CAMERA_X_M:-0}
      LINE_TRACKING_TAG_ROUTE_CAMERA_Y_M: ${LINE_TRACKING_TAG_ROUTE_CAMERA_Y_M:-0}
      LINE_TRACKING_TAG_ROUTE_CAMERA_Z_M: ${LINE_TRACKING_TAG_ROUTE_CAMERA_Z_M:-0}
      LINE_TRACKING_TAG_ROUTE_CAMERA_ROLL_DEG: ${LINE_TRACKING_TAG_ROUTE_CAMERA_ROLL_DEG:-0}
      LINE_TRACKING_TAG_ROUTE_CAMERA_PITCH_DEG: ${LINE_TRACKING_TAG_ROUTE_CAMERA_PITCH_DEG:-0}
      LINE_TRACKING_TAG_ROUTE_SPEED_MPS: ${LINE_TRACKING_TAG_ROUTE_SPEED_MPS:-0.30}
      LINE_TRACKING_TAG_ROUTE_MAX_RANGE_M: ${LINE_TRACKING_TAG_ROUTE_MAX_RANGE_M:-3.0}
      LINE_TRACKING_TAG_ROUTE_ARRIVAL_AHEAD_M: ${LINE_TRACKING_TAG_ROUTE_ARRIVAL_AHEAD_M:-0.5}
      LINE_TRACKING_TAG_ROUTE_STRAIGHT_TIMEOUT_SEC: ${LINE_TRACKING_TAG_ROUTE_STRAIGHT_TIMEOUT_SEC:-120}
